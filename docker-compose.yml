# Local Postgres for development:      docker compose up -d db
# Prod-like full stack (db + migrate + web): docker compose --profile app up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: autocompare
      POSTGRES_PASSWORD: autocompare
      POSTGRES_DB: autocompare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocompare -d autocompare"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: ["app"]
    build: { context: ., target: migrator }
    environment:
      DATABASE_URL: postgresql://autocompare:autocompare@db:5432/autocompare?schema=public
    depends_on:
      db: { condition: service_healthy }

  web:
    profiles: ["app"]
    build: { context: ., target: runner }
    environment:
      DATABASE_URL: postgresql://autocompare:autocompare@db:5432/autocompare?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
